<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapLibre 풀스택 데모 — 셋업 중</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f1e3d 0%, #1a3a6e 50%, #0a1530 100%);
    color: #e0e8f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 720px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, #6ec5ff, #b288ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 1.1rem;
    color: #9bb4d4;
    margin-bottom: 2rem;
  }
  .status {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(110, 197, 255, 0.3);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    backdrop-filter: blur(10px);
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .status-row:last-child { border-bottom: none; }
  .status-label { color: #9bb4d4; font-size: 0.95rem; }
  .status-value { color: #6ec5ff; font-weight: 600; font-size: 0.95rem; }
  .status-value.building { color: #ffb84d; }
  .links {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  a {
    display: inline-block;
    padding: 0.6rem 1.2rem;
    background: rgba(110, 197, 255, 0.1);
    border: 1px solid rgba(110, 197, 255, 0.4);
    border-radius: 8px;
    color: #6ec5ff;
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  a:hover {
    background: rgba(110, 197, 255, 0.2);
    border-color: #6ec5ff;
    transform: translateY(-1px);
  }
  .footer {
    margin-top: 2rem;
    color: #6b8099;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗺️ MapLibre 풀스택 데모</h1>
  <p class="subtitle">maplibre-gl-js v5 + 20+ 공식 예제 + 15+ 무료 공개 데이터</p>

  <div class="status">
    <div class="status-row">
      <span class="status-label">📦 저장소</span>
      <span class="status-value">sigco3111/maplibre-fullstack-demo</span>
    </div>
    <div class="status-row">
      <span class="status-label">⚡ 상태</span>
      <span class="status-value building">Tier 1 셋업 중</span>
    </div>
    <div class="status-row">
      <span class="status-label">💰 비용</span>
      <span class="status-value">$0 / API 키 0</span>
    </div>
    <div class="status-row">
      <span class="status-label">🎯 목표</span>
      <span class="status-value">3D 글로브 + 20+ 예제</span>
    </div>
  </div>

  <div class="links">
    <a href="https://github.com/sigco3111/maplibre-fullstack-demo" target="_blank">📂 GitHub</a>
    <a href="https://maplibre.org/maplibre-gl-js/docs/examples/" target="_blank">📚 maplibre 예제</a>
    <a href="https://openfreemap.org/" target="_blank">🗺️ OpenFreeMap</a>
  </div>

  <p class="footer">🛠️ Vite + TypeScript + MapLibre GL JS v5 · BSD 3-Clause / MIT</p>
</div>
</body>
</html>
